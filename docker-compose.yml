version: '3.8'
services:
  mongo:
    image: mongo:latest
    container_name: mongodb_wappR
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  nestjs:
    build: .
    container_name: nestjs_wappR
    restart: always
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/wappR
    command: npm run start

volumes:
  mongodb_data:
